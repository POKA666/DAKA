<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小打卡">
<meta name="format-detection" content="telephone=no">
<title>小打卡 · 每日计划</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wall" aria-hidden="true"></div>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div class="brand-text">
        <h1>小打卡</h1>
        <p>每天 23:00 结算 · 只在这台手机里</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="主导航">
      <button class="tab-btn is-active" data-tab="today" role="tab" aria-selected="true">今日</button>
      <button class="tab-btn" data-tab="calendar" role="tab" aria-selected="false">日历</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">分析</button>
      <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false">设置</button>
    </nav>
  </header>

  <main id="view" class="view" role="tabpanel"></main>

  <p class="app-foot" id="appFoot">数据不联网、不上传 · 换手机或清理浏览器前，请到「设置」导出备份</p>
</div>

<button class="fab" id="fab" data-action="new-plan" aria-label="添加计划">＋</button>

<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">添加计划</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="关闭">✕</button>
    </div>

    <form id="planForm" novalidate>
      <label class="field">
        <span class="field-label">计划名称</span>
        <input id="planName" type="text" maxlength="12" autocomplete="off"
               placeholder="例如：早起、喝水、读书 20 分钟">
      </label>

      <div class="field">
        <span class="field-label">图标</span>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="field">
        <span class="field-label">颜色</span>
        <div class="color-row" id="colorRow"></div>
      </div>

      <div class="field">
        <span class="field-label">频率</span>
        <div class="seg" id="freqSeg">
          <button type="button" class="seg-btn is-active" data-freq="daily">每天</button>
          <button type="button" class="seg-btn" data-freq="weekly">每周</button>
        </div>
        <div class="weekday-row" id="weekdayRow" hidden></div>
      </div>

      <p class="form-error" id="planError" role="alert" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="planDelete" hidden>删除</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<input type="file" id="wallFile" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">小打卡需要开启 JavaScript 才能使用。</p></noscript>

<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
